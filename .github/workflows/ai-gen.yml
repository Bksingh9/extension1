name: ai-gen

# Free AI video + image generation in the cloud.
# Runs `tools/ai-gen/gen.py` on a GitHub-hosted Ubuntu runner, which
# has full internet egress and can reach Hugging Face ZeroGPU Spaces.
#
# Two ways to fire it:
#   A. Actions tab → "ai-gen" → Run workflow (full control via inputs).
#   B. Push a change to .github/ai-gen-trigger.txt — runs batch video
#      over tools/ai-gen/prompts/clips.txt with defaults, then commits
#      the resulting clips back into episodes/003-hormuz/broll/.
#
# Setup (one time): add a repo secret HF_TOKEN
#   Settings → Secrets and variables → Actions → New repository secret
#   Token: https://huggingface.co/settings/tokens (read scope).
# Without the secret it runs ANONYMOUSLY against ZeroGPU (tighter
# quota, may fail) — set the token for reliable results.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'single (one prompt) or batch (prompts file path)'
        type: choice
        options: [single, batch]
        default: batch
      prompt:
        description: 'single mode: the prompt text'
        type: string
        default: 'aerial dawn shot of a narrow sea strait, a single tanker drifting through, glassy water, cinematic'
      prompts_file:
        description: 'batch mode: path in repo'
        type: string
        default: 'tools/ai-gen/prompts/clips.txt'
      kind:
        description: 'video or image'
        type: choice
        options: [video, image]
        default: video
      space:
        description: 'Space id or "auto"'
        type: string
        default: 'auto'
      count:
        description: 'how many (single mode)'
        type: string
        default: '1'
  push:
    branches: [claude/setup-youtube-production-GYo4W]
    paths: ['.github/ai-gen-trigger.txt']

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      AI_GEN_ROOT: ${{ github.workspace }}/ai-gen
      # Effective inputs — fall back to defaults on push events.
      MODE: ${{ inputs.mode || 'batch' }}
      PROMPT: ${{ inputs.prompt || 'aerial dawn shot of a narrow sea strait, a single tanker drifting through, glassy water, cinematic' }}
      PROMPTS_FILE: ${{ inputs.prompts_file || 'tools/ai-gen/prompts/clips.txt' }}
      KIND: ${{ inputs.kind || 'video' }}
      SPACE: ${{ inputs.space || 'auto' }}
      COUNT: ${{ inputs.count || '1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bootstrap ai-gen project
        run: |
          set -e
          mkdir -p "$AI_GEN_ROOT"/{config,prompts,logs,outputs}
          cp tools/ai-gen/config/spaces.yaml  "$AI_GEN_ROOT/config/"
          cp tools/ai-gen/prompts/clips.txt   "$AI_GEN_ROOT/prompts/"
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet \
            gradio_client huggingface_hub python-slugify rich pyyaml httpx tenacity

      - name: Sanity check — HF reachable from this runner?
        run: |
          curl -s -o /dev/null -w "huggingface.co http=%{http_code}\n" https://huggingface.co
          echo "(403 = blocked; 200/302/301 = good)"
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::HF_TOKEN secret not set — running anonymously (limited ZeroGPU quota, may fail)."
          fi

      - name: List spaces + health
        run: |
          python tools/ai-gen/gen.py list-spaces
          python tools/ai-gen/gen.py health || true

      - name: Generate (single)
        if: env.MODE == 'single'
        run: |
          python tools/ai-gen/gen.py "$KIND" \
            --prompt "$PROMPT" --space "$SPACE" --n "$COUNT" \
            --tag "gha-${{ github.run_number }}"

      - name: Generate (batch)
        if: env.MODE == 'batch'
        run: |
          python tools/ai-gen/gen.py batch \
            --file "$PROMPTS_FILE" --kind "$KIND" --space "$SPACE" \
            --tag "gha-${{ github.run_number }}"

      - name: Show run log
        if: always()
        run: |
          echo "=== runs.csv ==="; cat "$AI_GEN_ROOT/logs/runs.csv" 2>/dev/null || echo "(none)"
          echo "=== outputs ==="; find "$AI_GEN_ROOT/outputs" -type f -printf "%p  %s bytes\n" 2>/dev/null || true

      - name: Commit clips back into episodes/003-hormuz/broll/
        if: always()
        run: |
          set -e
          shopt -s nullglob globstar
          files=("$AI_GEN_ROOT"/outputs/**/*.mp4 "$AI_GEN_ROOT"/outputs/**/*.png)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no outputs to commit"; exit 0
          fi
          mkdir -p episodes/003-hormuz/broll
          cp "${files[@]}" episodes/003-hormuz/broll/ || true
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f episodes/003-hormuz/broll/
          git commit -m "ci: generated b-roll clips, run ${{ github.run_number }} [skip ci]" || { echo "nothing to commit"; exit 0; }
          git push origin HEAD:claude/setup-youtube-production-GYo4W

      - name: Upload outputs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-gen-outputs-run-${{ github.run_number }}
          path: |
            ai-gen/outputs/**
            ai-gen/logs/runs.csv
          if-no-files-found: warn
          retention-days: 14
